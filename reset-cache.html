<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оновлення HMI Manual</title><style>body{font:16px/1.5 system-ui,Segoe UI,Arial;margin:0;display:grid;place-items:center;min-height:100vh;background:#f7f8fa;color:#1f2933}.box{max-width:560px;padding:28px;background:#fff;border:1px solid #d9dee5;border-radius:8px}h1{font-size:22px;margin-top:0}</style><div class="box"><h1>Оновлення веб-інструкції</h1><p id="status">Очищення кешу попередніх версій…</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}if('caches'in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}}catch(e){}document.getElementById('status').textContent='Готово. Відкриваємо актуальну версію…';setTimeout(()=>location.replace('./?v37=1'),500)})();</script></html>
